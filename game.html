<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole Ranger X (PC Full Option)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Itim&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- ASSETS --- */
            --img-mole: url('mole.jpg');
            --img-gold: url('mole_gold.png');
            --img-bomb: url('bomb.jpg');
            --img-boss: url('boss.png');
            
            /* --- COLORS --- */
            --wood-dark: #5D4037;
            --wood-light: #8D6E63;
            --dirt: #4E342E;
        }

        * { box-sizing: border-box; user-select: none; }
        
        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, #4FC3F7 0%, #81C784 100%);
            font-family: 'Fredoka One', 'Itim', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; inset: 0; z-index: 4000;
            background: #3E2723;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; cursor: pointer;
        }
        .pulse-text { font-size: 3rem; animation: pulse 1s infinite; color: #FFD54F; margin-top: 20px;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.95); opacity: 0.7; } 100% { transform: scale(1); } }

        /* --- INTRO VIDEO --- */
        #intro-container {
            position: fixed; inset: 0; z-index: 3000;
            background: #000; display: none;
            justify-content: center; align-items: center;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #skip-btn {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(255,255,255,0.2); border: 2px solid white;
            color: white; padding: 10px 30px; border-radius: 30px;
            cursor: pointer; font-size: 1.5rem; z-index: 3001;
        }

        /* --- MENUS --- */
        .screen {
            position: absolute; inset: 0;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            z-index: 1000; transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; z-index: -1; }

        .wooden-board {
            background: var(--wood-light);
            border: 10px solid var(--wood-dark);
            border-radius: 30px; padding: 40px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            min-width: 500px;
        }
        h1 { margin: 0 0 30px 0; color: #FFECB3; text-shadow: 4px 4px 0 var(--wood-dark); font-size: 4rem; line-height: 1; text-align: center;}
        
        .btn {
            background: #FFCA28; color: var(--wood-dark);
            border: 4px solid var(--wood-dark);
            padding: 15px 60px; margin: 10px;
            font-size: 2rem; font-family: 'Fredoka One';
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 0 #F57F17; transition: 0.1s;
            min-width: 300px; text-align: center;
        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn:active { transform: translateY(6px); box-shadow: none; }
        .btn.red { background: #FF7043; box-shadow: 0 8px 0 #D84315; color: white; }

        /* Settings Row */
        .setting-row {
            display: flex; justify-content: space-between; width: 100%;
            font-size: 2.5rem; color: #3E2723; margin: 15px 0; font-weight: bold;
        }
        .toggle-btn { color: #FFB300; cursor: pointer; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); }

        /* --- GAMEPLAY --- */
        #game-ui { width: 100%; height: 100%; display: flex; }

        .player-zone {
            flex: 1; position: relative;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            border: 10px solid var(--wood-dark);
        }
        #p1-zone { background: #C8E6C9; border-right: 5px solid var(--wood-dark); }
        #p2-zone { background: #FFE0B2; border-left: 5px solid var(--wood-dark); }

        /* HUD */
        .hud {
            position: absolute; top: 20px; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            font-size: 2.5rem; color: var(--wood-dark); font-weight: bold;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
        }
        .hp-bar { color: #D32F2F; letter-spacing: 5px; font-size: 2rem; }

        /* GRID */
        .farm-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
            width: 70%; max-width: 600px; aspect-ratio: 3/2;
            margin-top: 50px;
        }
        .mound {
            background: var(--dirt); border-radius: 50%;
            position: relative; border: 6px solid #3E2723;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.6);
            cursor: pointer;
        }
        .mound::after { /* Grass */
            content: ''; position: absolute; top: -10px; left: 5%; width: 90%; height: 30px;
            background: #558B2F; border-radius: 50%; z-index: 2;
        }
        .mound-mask {
            width: 100%; height: 100%; border-radius: 50%;
            position: relative; overflow: hidden;
        }
        .key-hint {
            position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
            background: #333; color: #FFF; padding: 2px 10px; border-radius: 10px;
            font-size: 1.2rem; font-family: sans-serif; font-weight: bold; border: 2px solid #FFF;
            z-index: 10; white-space: nowrap;
        }

        /* Characters */
        .char {
            width: 80%; height: 90%;
            position: absolute; top: 120%; left: 10%;
            background-size: contain; background-repeat: no-repeat; background-position: bottom center;
            transition: top 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4));
        }
        .mound.up .char { top: 10%; }
        
        .mound[data-type="normal"] .char { background-image: var(--img-mole); }
        .mound[data-type="gold"] .char   { background-image: var(--img-gold); }
        .mound[data-type="bomb"] .char   { background-image: var(--img-bomb); }
        .mound[data-type="boss"] .char   { background-image: var(--img-boss); transform: scale(1.3); }

        /* --- VISUAL EFFECTS --- */
        .hit-anim { animation: hitPop 0.15s; filter: brightness(2); }
        @keyframes hitPop { 50% { transform: scale(1.2); } }

        /* Effect: Floating Text */
        .float-text {
            position: absolute; color: #FFF; font-size: 3rem; font-weight: bold;
            pointer-events: none; z-index: 100;
            text-shadow: 2px 2px 0 #000;
            animation: floatUp 0.8s forwards;
        }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.2); opacity: 0; } }

        /* Effect: Boss Attack (Stun) */
        .boss-effect {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: #FF5252; font-size: 5rem; z-index: 50;
            font-family: 'Fredoka One'; text-shadow: 0 0 30px red;
            animation: flash 0.2s;
        }
        .boss-effect img { width: 150px; animation: shake 0.5s infinite; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

        /* TIMER */
        #center-clock {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #FFF; border: 6px solid var(--wood-dark);
            padding: 10px 40px; border-radius: 20px; z-index: 20;
            text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }
        #timer-val { font-size: 4rem; color: var(--wood-dark); line-height: 1; }

        /* Info */
        .controls-info { margin-top: 20px; font-size: 1.5rem; color: #5D4037; font-family: 'Itim'; display: flex; gap: 40px; }
        .key-group { text-align: center; background: rgba(255,255,255,0.5); padding: 15px; border-radius: 15px; }
        .kbd { background: #333; color: white; padding: 2px 8px; border-radius: 4px; font-family: monospace; }
        .note { font-size: 1rem; color: #D32F2F; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="splash-screen" onclick="GameApp.startExperience()">
        <h1 style="font-size: 5rem; margin-bottom: 20px;">MOLE RANGER X</h1>
        <div style="font-size: 2rem;">PC EDITION</div>
        <div class="pulse-text">CLICK TO START</div>
    </div>

    <div id="intro-container">
        <video id="intro-vid" playsinline>
            <source src="mole title.mp4" type="video/mp4">
        </video>
        <div id="skip-btn" onclick="GameApp.skipIntro()">SKIP INTRO (ENTER)</div>
    </div>

    <div id="menu-main" class="screen hidden">
        <div class="wooden-board">
            <h1>MOLE RANGER X</h1>
            <div class="controls-info">
                <div class="key-group">
                    <strong>P1 (LEFT)</strong><br>
                    <span class="kbd">Q</span> <span class="kbd">W</span> <span class="kbd">E</span><br>
                    <span class="kbd">A</span> <span class="kbd">S</span> <span class="kbd">D</span>
                </div>
                <div class="key-group">
                    <strong>P2 (RIGHT)</strong><br>
                    <span class="kbd">7</span> <span class="kbd">8</span> <span class="kbd">9</span><br>
                    <span class="kbd">4</span> <span class="kbd">5</span> <span class="kbd">6</span><br>
                    <div class="note">*NUMLOCK ON*</div>
                </div>
            </div>
            <br>
            <button class="btn" onclick="Menu.toLevel()">START GAME</button>
            <button class="btn" onclick="Menu.toSettings()">SETTINGS</button>
        </div>
    </div>

    <div id="menu-settings" class="screen hidden">
        <div class="wooden-board">
            <h1>SETTINGS</h1>
            <div class="setting-row">
                <span>MUSIC</span>
                <span id="btn-bgm" class="toggle-btn" onclick="AudioSys.toggleBGM()">ON</span>
            </div>
            <div class="setting-row">
                <span>SOUND FX</span>
                <span id="btn-sfx" class="toggle-btn" onclick="AudioSys.toggleSFX()">ON</span>
            </div>
            <br>
            <button class="btn" onclick="Menu.back()">OK</button>
        </div>
    </div>

    <div id="menu-level" class="screen hidden">
        <div class="wooden-board">
            <h1>SELECT DIFFICULTY</h1>
            <button class="btn" onclick="Game.start(1)">EASY</button>
            <button class="btn" onclick="Game.start(2)">NORMAL</button>
            <button class="btn" onclick="Game.start(3)">HARD</button>
            <button class="btn red" onclick="Menu.back()">BACK</button>
        </div>
    </div>

    <div id="game-ui" class="hidden">
        <div id="center-clock">
            <div id="timer-val">60</div>
        </div>

        <div id="p1-zone" class="player-zone">
            <div class="hud">
                <span>PLAYER 1</span>
                <span id="p1-score" style="font-size: 4rem;">0</span>
                <div id="p1-hp" class="hp-bar">❤️❤️❤️</div>
            </div>
            <div class="farm-grid" id="grid-p1"></div>
        </div>

        <div id="p2-zone" class="player-zone">
            <div class="hud">
                <span>PLAYER 2</span>
                <span id="p2-score" style="font-size: 4rem;">0</span>
                <div id="p2-hp" class="hp-bar">❤️❤️❤️</div>
            </div>
            <div class="farm-grid" id="grid-p2"></div>
        </div>
    </div>

    <div id="menu-result" class="screen hidden">
        <div class="wooden-board">
            <h1 id="res-title">GAME OVER</h1>
            <div id="res-score" style="font-size:4rem; color:#5D4037; margin-bottom:30px;">0 - 0</div>
            <button class="btn" onclick="Menu.toLevel()">PLAY AGAIN</button>
            <button class="btn red" onclick="Menu.toMain()">MAIN MENU</button>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const KEYS = {
            'q': {p:1, i:0}, 'w': {p:1, i:1}, 'e': {p:1, i:2},
            'a': {p:1, i:3}, 's': {p:1, i:4}, 'd': {p:1, i:5},
            
            '7': {p:2, i:0}, '8': {p:2, i:1}, '9': {p:2, i:2},
            '4': {p:2, i:3}, '5': {p:2, i:4}, '6': {p:2, i:5}
        };
        const LBL_P1 = ['Q','W','E','A','S','D'];
        const LBL_P2 = ['Num 7','Num 8','Num 9','Num 4','Num 5','Num 6'];

        // --- APP ---
        const GameApp = {
            startExperience: () => {
                document.getElementById('splash-screen').style.display = 'none';
                const cont = document.getElementById('intro-container');
                cont.style.display = 'flex';
                
                const vid = document.getElementById('intro-vid');
                vid.volume = 0.5;
                vid.play().catch(e => console.error(e));
                vid.onended = GameApp.skipIntro;
                
                AudioSys.init();

                window.addEventListener('keydown', (e) => {
                    const k = e.key.toLowerCase();
                    if(cont.style.display === 'flex' && k === 'enter') GameApp.skipIntro();
                    if(Game.active && KEYS[k]) Game.hit(KEYS[k].p, KEYS[k].i);
                });
            },
            skipIntro: () => {
                document.getElementById('intro-vid').pause();
                document.getElementById('intro-container').style.display = 'none';
                Menu.toMain();
            }
        };

        // --- AUDIO ---
        const AudioSys = {
            ctx: null, bgmNode: null, bgmOn: true, sfxOn: true,
            init: () => { 
                if(!AudioSys.ctx) AudioSys.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                if(AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
            },
            toggleBGM: () => {
                AudioSys.bgmOn = !AudioSys.bgmOn;
                document.getElementById('btn-bgm').innerText = AudioSys.bgmOn ? "ON" : "OFF";
                document.getElementById('btn-bgm').style.color = AudioSys.bgmOn ? "#FFB300" : "#888";
            },
            toggleSFX: () => {
                AudioSys.sfxOn = !AudioSys.sfxOn;
                document.getElementById('btn-sfx').innerText = AudioSys.sfxOn ? "ON" : "OFF";
                document.getElementById('btn-sfx').style.color = AudioSys.sfxOn ? "#FFB300" : "#888";
            },
            playSFX: (type) => {
                if(!AudioSys.sfxOn || !AudioSys.ctx) return;
                const t = AudioSys.ctx.currentTime;
                const o = AudioSys.ctx.createOscillator();
                const g = AudioSys.ctx.createGain();
                o.connect(g); g.connect(AudioSys.ctx.destination);

                if(type === 'hit') {
                    o.frequency.setValueAtTime(500, t); o.frequency.linearRampToValueAtTime(800, t+0.1);
                    g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0, t+0.1);
                    o.start(t); o.stop(t+0.1);
                } else if(type === 'gold') {
                    o.type = 'sine'; o.frequency.setValueAtTime(1000, t); o.frequency.linearRampToValueAtTime(1500, t+0.2);
                    g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0, t+0.2);
                    o.start(t); o.stop(t+0.2);
                } else if(type === 'bomb') {
                    o.type = 'square'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(50, t+0.4);
                    g.gain.setValueAtTime(0.5, t); g.gain.linearRampToValueAtTime(0, t+0.4);
                    o.start(t); o.stop(t+0.4);
                } else if(type === 'boss') {
                    o.type = 'sawtooth'; o.frequency.setValueAtTime(100, t); o.frequency.linearRampToValueAtTime(50, t+0.5);
                    g.gain.setValueAtTime(0.5, t); g.gain.linearRampToValueAtTime(0, t+0.5);
                    o.start(t); o.stop(t+0.5);
                }
            },
            startBGM: () => {
                if(AudioSys.bgmNode) return;
                let step = 0;
                AudioSys.bgmNode = setInterval(() => {
                    if(!AudioSys.bgmOn) return;
                    const t = AudioSys.ctx.currentTime;
                    const o = AudioSys.ctx.createOscillator();
                    const g = AudioSys.ctx.createGain();
                    o.connect(g); g.connect(AudioSys.ctx.destination);
                    
                    if(step%4===0) { 
                        o.frequency.setValueAtTime(150, t); 
                        g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t+0.1);
                        o.start(t); o.stop(t+0.1);
                    }
                    if(Math.random()>0.6) {
                        o.type='triangle'; o.frequency.setValueAtTime(300 + Math.random()*300, t);
                        g.gain.setValueAtTime(0.05, t); g.gain.linearRampToValueAtTime(0, t+0.2);
                        o.start(t); o.stop(t+0.2);
                    }
                    step++;
                }, 200);
            },
            stopBGM: () => { clearInterval(AudioSys.bgmNode); AudioSys.bgmNode = null; }
        };

        // --- MENU ---
        const Menu = {
            toMain: () => Menu.show('menu-main'),
            toLevel: () => Menu.show('menu-level'),
            toSettings: () => Menu.show('menu-settings'),
            back: () => Menu.show('menu-main'),
            show: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
                if(id) document.getElementById(id).classList.remove('hidden');
            }
        };

        // --- GAME ---
        const Game = {
            active: false, timer: 60, diff: 1, players: [], loops: [],

            start: (d) => {
                Game.diff = d;
                Menu.show(null);
                document.getElementById('game-ui').classList.remove('hidden');
                Game.reset();
                Game.active = true;
                AudioSys.startBGM();

                Game.loops.push(setInterval(() => {
                    Game.timer--;
                    document.getElementById('timer-val').innerText = Game.timer;
                    if(Game.timer<=0) Game.end();
                }, 1000));

                let rate = 1000 - (d*150);
                Game.loops.push(setInterval(() => Game.spawn(1), rate));
                Game.loops.push(setInterval(() => Game.spawn(2), rate));
            },

            reset: () => {
                Game.timer = 60;
                document.getElementById('timer-val').innerText = 60;
                Game.players = [{id:1, score:0, hp:3, debuff:false}, {id:2, score:0, hp:3, debuff:false}];
                Game.createGrid(1); Game.createGrid(2);
                Game.updateUI();
            },

            createGrid: (pid) => {
                const g = document.getElementById(`grid-p${pid}`);
                g.innerHTML = '';
                const lbls = pid === 1 ? LBL_P1 : LBL_P2;
                for(let i=0; i<6; i++) {
                    const m = document.createElement('div');
                    m.className = 'mound';
                    m.id = `p${pid}-h${i}`;
                    m.innerHTML = `<div class="mound-mask"><div class="char"></div></div><div class="key-hint">${lbls[i]}</div>`;
                    m.onmousedown = () => Game.hit(pid, i); 
                    g.appendChild(m);
                }
            },

            spawn: (pid) => {
                if(!Game.active || Game.players[pid-1].debuff) return;
                const holes = document.querySelectorAll(`#grid-p${pid} .mound:not(.up)`);
                if(holes.length === 0) return;
                const hole = holes[Math.floor(Math.random()*holes.length)];
                
                let r = Math.random();
                let type = 'normal';
                if(r > 0.9) type = 'boss';
                else if(r > 0.8) type = 'gold';
                else if(r > 0.65) type = 'bomb';
                
                hole.dataset.type = type;
                hole.classList.add('up');
                
                let stay = 1500 - (Game.diff*200);
                setTimeout(() => { if(Game.active) hole.classList.remove('up'); }, stay);
            },

            hit: (pid, idx) => {
                if(!Game.active) return;
                const p = Game.players[pid-1];
                const enemy = Game.players[pid===1?1:0];

                if(p.hp<=0 || p.debuff) return;

                const hole = document.getElementById(`p${pid}-h${idx}`);
                if(!hole.classList.contains('up')) return;

                hole.classList.remove('up');
                const char = hole.querySelector('.char');
                char.classList.add('hit-anim');
                setTimeout(()=>char.classList.remove('hit-anim'), 150);

                const type = hole.dataset.type;
                const rect = hole.getBoundingClientRect(); // Find pos for text

                if(type === 'bomb') {
                    p.hp--;
                    AudioSys.playSFX('bomb');
                    Game.shake(pid);
                    Game.showFloatText(rect.left, rect.top, "-1 HP", "#FF5252");
                } 
                else if(type === 'boss') {
                    // Attacker Feedback
                    p.score += 50;
                    Game.showFloatText(rect.left, rect.top, "ATTACK!", "#FFD54F");
                    
                    // Enemy Penalty
                    enemy.debuff = true;
                    AudioSys.playSFX('boss');
                    Game.applyBossEffect(pid===1?2:1);
                } 
                else if(type === 'gold') {
                    p.score += 50;
                    AudioSys.playSFX('gold');
                    Game.showFloatText(rect.left, rect.top, "+50", "#FFD700");
                }
                else {
                    p.score += 10;
                    AudioSys.playSFX('hit');
                    Game.showFloatText(rect.left, rect.top, "+10", "#FFF");
                }
                Game.updateUI();
                if(p.hp<=0) Game.end();
            },

            showFloatText: (x, y, text, color) => {
                const el = document.createElement('div');
                el.className = 'float-text';
                el.innerText = text;
                el.style.left = (x + 20) + 'px';
                el.style.top = (y - 20) + 'px';
                el.style.color = color;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 800);
            },

            applyBossEffect: (targetPid) => {
                const zone = document.getElementById(`p${targetPid}-zone`);
                const fx = document.createElement('div');
                fx.className = 'boss-effect';
                fx.innerHTML = `<img src="boss.png"><div>ATTACKED!</div><div style="font-size:2rem; color:white;">WAIT 2s</div>`;
                zone.appendChild(fx);
                
                setTimeout(() => { 
                    fx.remove(); 
                    if(Game.active) Game.players[targetPid-1].debuff = false; 
                }, 2000);
            },

            shake: (pid) => {
                const z = document.getElementById(`p${pid}-zone`);
                z.classList.add('shake');
                setTimeout(()=>z.classList.remove('shake'), 400);
            },

            updateUI: () => {
                Game.players.forEach(p => {
                    document.getElementById(`p${p.id}-score`).innerText = p.score;
                    document.getElementById(`p${p.id}-hp`).innerText = "❤️".repeat(p.hp);
                });
            },

            end: () => {
                Game.active = false;
                Game.loops.forEach(clearInterval);
                AudioSys.stopBGM();
                document.getElementById('game-ui').classList.add('hidden');
                document.getElementById('menu-result').classList.remove('hidden');

                const p1 = Game.players[0]; const p2 = Game.players[1];
                let t = "";
                if(p1.hp<=0 && p2.hp<=0) t = "DRAW!";
                else if(p1.hp<=0) t = "P2 WINS!";
                else if(p2.hp<=0) t = "P1 WINS!";
                else t = p1.score > p2.score ? "P1 WINS!" : "P2 WINS!";

                document.getElementById('res-title').innerText = t;
                document.getElementById('res-score').innerText = `${p1.score} - ${p2.score}`;
            }
        };
    </script>
</body>
</html>
